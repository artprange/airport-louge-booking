services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: lounge_booking

    ports:
      - '127.0.0.1:15432:5432'

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U app -d lounge_booking']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
