# Separate project and volume: leaves the existing development database alone.
name: lounge-booking-stack
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: lounge_booking
    volumes:
      - stack_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d lounge_booking"]
      interval: 5s
      timeout: 5s
      retries: 12

  migrate:
    build:
      context: ./backend
      target: build
    image: lounge-booking-tools:local
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/lounge_booking?schema=public
    command: ["./node_modules/.bin/prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: ./backend
      target: runtime
    image: lounge-booking-api:local
    environment:
      NODE_ENV: production
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgresql://app:app@postgres:5432/lounge_booking?schema=public
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
    init: true

  frontend:
    build: ./frontend
    image: lounge-booking-web:local
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12

  seed:
    profiles: [tools]
    build:
      context: ./backend
      target: build
    image: lounge-booking-tools:local
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/lounge_booking?schema=public
    command: ["npm", "run", "db:seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  stack_postgres_data:
